name: Build mod jar

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show artifacts
        run: ls -lh build/libs

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

