name: Build mod jar

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

concurrency:
  group: build-jar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod jar
        run: ./gradlew build --no-daemon --stacktrace

      - name: Collect + verify jar
        run: |
          set -euo pipefail
          mkdir -p dist
          # remapped (release) jar — не sources и не dev
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) continue ;;
            esac
            cp "$f" dist/
          done
          ls -lh build/libs dist
          unzip -l dist/*.jar | head -40

          JAR=$(ls dist/*.jar | head -1)
          echo "JAR=$JAR" >> "$GITHUB_ENV"

          unzip -l "$JAR" | grep -q "fabric.mod.json"      || { echo "::error::fabric.mod.json отсутствует в jar"; exit 1; }
          unzip -l "$JAR" | grep -q "zenithdlc.mixins.json" || { echo "::error::zenithdlc.mixins.json отсутствует в jar"; exit 1; }
          unzip -l "$JAR" | grep -q "org/zenith/init/ZenithInitializer.class" || { echo "::error::главный класс мода отсутствует в jar"; exit 1; }
          unzip -l "$JAR" | grep -q "META-INF/jars/ViaFabricPlus" || { echo "::error::вложенные моды (META-INF/jars) отсутствуют в jar"; exit 1; }

          {
            echo "### Собранный jar"
            echo '```'
            ls -lh dist
            echo '```'
            echo "SHA-256: \`$(sha256sum "$JAR" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenith-jar
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish release with jar
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="Сборка мода ZenithDLC (${GITHUB_SHA::7}) из ветки ${GITHUB_REF_NAME}.
          Minecraft 1.21.11 / Fabric Loader 0.19.2 / Fabric API 0.141.6+1.21.11.
          Готовый jar: скачать ниже и положить в папку mods."
          gh release create "$TAG" "$JAR" \
            --title "Zenith build ${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest \
          || gh release upload "$TAG" "$JAR" --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name) — \(.size) байт — \(.url)"' | tee -a "$GITHUB_STEP_SUMMARY"
